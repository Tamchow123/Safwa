name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test-only Postgres credentials, distinct from any local-dev or production
# secret (phases-15.md §61 — "No reused production secret"). The database
# name must match db/reset-test-database.ts's safety pattern
# (/^safwa_test(_\w+)?$/) for the integration/E2E suites' own reset logic
# to be willing to touch it at all.
env:
  CI_POSTGRES_USER: ci_test
  CI_POSTGRES_PASSWORD: ci_test_only_password_not_a_secret
  CI_POSTGRES_DB: safwa_test
  CI_DATABASE_URL: postgres://ci_test:ci_test_only_password_not_a_secret@localhost:5432/safwa_test
  # Disposable, CI-only — never a real Better Auth secret.
  CI_BETTER_AUTH_SECRET: ci-only-better-auth-secret-value-never-used-in-production
  CI_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Quality & build
    runs-on: ubuntu-latest
    # A hung service container, Postgres step, or build must fail fast and
    # visibly rather than silently consuming the 360-minute platform
    # default and delaying every other queued run.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        # `services.*.options` does not support `${{ env.* }}` interpolation
        # — these literals must be kept in sync by hand with
        # CI_POSTGRES_USER/CI_POSTGRES_DB above whenever either changes, or
        # the health check never reports healthy and the job hangs until
        # its timeout.
        options: >-
          --health-cmd "pg_isready -U ci_test -d safwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate vocabulary data
        run: python scripts/validate-vocabulary.py

      - name: Verify Arabic integrity
        run: python scripts/arabic-extract.py --verify-known

      - name: Build content release
        run: pnpm content:build

      - name: Verify documentation Arabic
        run: pnpm docs:verify

      # Content only — the generated PWA icons are deliberately NOT re-rendered
      # here. sharp compiles a separate native binary per OS/arch, so byte
      # equality between a Windows-authored commit and this ubuntu runner is a
      # hope rather than a guarantee, and a gate built on it would eventually
      # go red for a reason unrelated to the change under review. The portable
      # half of that check — master digest, per-file digests, declared set,
      # stray files, brand colours — is scripts/icons-lock.ts and runs in the
      # "Unit tests" step below; the exact re-render is quality-gate.ps1 step
      # 7, on the authoring machine. See scripts/icons-lock.ts's header.
      - name: Generated artifacts are current and deterministic
        run: git diff --exit-code -- public/content content-server

      - name: Apply full migration chain
        run: pnpm db:migrate
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.CI_APP_URL }}

      - name: Register content versions
        run: pnpm db:register-content
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.CI_APP_URL }}

      # One Vitest config picks up every tests/integration/*.test.ts, so the
      # Phase 16 sync suites and the Phase 17 guest-merge suites run here
      # without this step changing — the same is true of the local gate's
      # step 11 (scripts/quality-gate.ps1), which is what keeps the two
      # equivalent (phases-17.md §27).
      - name: Database integration tests (constraints, auth, sync, guest merge)
        run: pnpm test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.CI_APP_URL }}
          EMAIL_TRANSPORT: console-file
          EMAIL_OUTBOX_DIR: .local/email-outbox

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Must follow the build, and only works after it: this compares
      # next.config.ts's outputFileTracingIncludes keys against Next's own
      # app-paths manifest. The unit suite checks the config against the route
      # graph that derives it; only Next's output can say whether either
      # spelling is one Next actually recognises. A key it does not is not an
      # error at build time — it silently pins nothing.
      - name: Traced routes exist in the build
        run: pnpm routes:verify

      # Also after the build, and for the same class of reason: the four
      # conditions phases-18.md §6 makes adopting @serwist/turbopack contingent
      # on are all invisible until something is built. A worker that still
      # compiles with an empty precache manifest is the failure that looks most
      # like success.
      - name: Service worker meets its adoption criteria
        run: pnpm sw:verify

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    # Four sequential Playwright configs (main, auth-disabled, rate-limit,
    # sync-disabled), each with its own DB reset + `next dev` boot + test run —
    # sized with
    # margin above observed local timing, not left at the 360-minute
    # platform default (see the quality job's identical rationale).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        # `services.*.options` does not support `${{ env.* }}` interpolation
        # — these literals must be kept in sync by hand with
        # CI_POSTGRES_USER/CI_POSTGRES_DB above whenever either changes, or
        # the health check never reports healthy and the job hangs until
        # its timeout.
        options: >-
          --health-cmd "pg_isready -U ci_test -d safwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (desktop + mobile Chromium, auth-disabled, rate-limit, sync-disabled, signup-closed)
        run: pnpm test:e2e
        env:
          # e2e/global-setup.ts shells out to `pnpm db:test:reset` AND, since
          # Phase 17, `pnpm db:register-content` — every study session the
          # server stores carries a `release_id` foreign key into
          # `content_versions`, so an authenticated push or guest merge fails
          # at the database without it. Both (like the quality job's own
          # migration/integration steps) go through
          # modules/env/server.ts's getServerEnv(), so the full
          # server-env schema must be satisfied even though this step only
          # touches the database — not just DATABASE_URL. Job-level `env:`
          # cannot reference the `env` context (only step-level `env:`
          # can), so this must live on the step rather than the job.
          # e2e/helpers/e2e-server-env.ts separately derives each
          # Playwright-managed server's own deterministic localhost
          # origin/port for its `next dev` webServer process — auth is
          # always enabled on the main E2E server (phases-15.md §61's
          # "Auth enabled").
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.CI_APP_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Only the HTML report — never test-results/ (raw traces can
          # embed request/response bodies) or the email outbox directory
          # (phases-15.md §61 — never upload tokens or outbox contents).
          path: |
            playwright-report/
            playwright-report-auth-disabled/
            playwright-report-auth-rate-limit/
            playwright-report-sync-disabled/
            playwright-report-signup-closed/

  e2e-offline:
    # This exact name is what phases-18.md §12's H6 tells the repository owner to
    # add to branch protection — keep the two in step.
    name: E2E (offline + WebKit)
    runs-on: ubuntu-latest
    needs: quality
    # A SEPARATE job, parallel with `e2e`, rather than another config appended
    # to it. Three reasons, in order of how much they matter:
    #
    #  1. This is the only suite that runs `next build && next start` instead of
    #     `next dev`, so it pays for a full production build before its first
    #     test. Serialising that behind the four dev-server configs would add
    #     its cost to the critical path for no benefit.
    #  2. It needs a second browser download (WebKit) that no other job wants.
    #  3. A failure here says something different from a failure in `e2e` —
    #     "offline/PWA broke", not "the app broke" — and a separate red check
    #     says that without anyone reading a log.
    #
    # Adding this to branch protection's required checks is a GitHub-UI action
    # this file cannot perform: `main` currently requires "Quality & build" and
    # "E2E (Chromium)" only. It is tracked as H6 in phases-18.md §12, so until
    # the owner does it, a failure here does NOT block a merge.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        # Same hand-synced literals as the `e2e` job — `services.*.options`
        # cannot interpolate `${{ env.* }}`.
        options: >-
          --health-cmd "pg_isready -U ci_test -d safwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both engines: Chromium runs the offline journey (WebKit cannot emulate
      # an offline navigation — see e2e/offline.spec.ts), WebKit runs the
      # installability and touch-target criteria on the engine every iOS
      # browser actually uses.
      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run offline / PWA E2E (Pixel 7 + iPhone WebKit, real build)
        run: pnpm test:e2e:offline
        env:
          # The same reasoning as the `e2e` job's step env: e2e/global-setup.ts
          # resets the database and registers a content release through
          # getServerEnv(), so the full server-env schema must be satisfied
          # here too — not just DATABASE_URL. The Playwright-managed server's
          # own origin/port come from e2e/helpers/e2e-server-env.ts
          # (offlineServerEnv, port 3105), not from these.
          NODE_ENV: test
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.CI_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ env.CI_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.CI_APP_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-offline
          # Same restriction as the `e2e` job: the HTML report only, never
          # test-results/ or the outbox.
          path: playwright-report-offline/
          retention-days: 7
